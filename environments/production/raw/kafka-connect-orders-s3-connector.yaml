metadata:
  name: rel22-allow-kafka-connect-bootstrap-rest
  namespace: techx-tf4
  labels:
    app.kubernetes.io/name: kafka-connect-orders-s3-connector
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: techx-corp
    cdo08.techx.io/task: CDO08-REL-22
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka-connect-orders-archive
      app.kubernetes.io/component: kafka-connect
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-connect-orders-s3-connector
              app.kubernetes.io/component: kafka-connect
      ports:
        - protocol: TCP
          port: 8083

