apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-connect-orders-s3-connector
  namespace: techx-tf4
  labels:
    app.kubernetes.io/name: kafka-connect-orders-s3-connector
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: techx-corp
    cdo08.techx.io/task: CDO08-REL-22
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-connect-orders-s3-connector
        app.kubernetes.io/component: kafka-connect
        app.kubernetes.io/part-of: techx-corp
        cdo08.techx.io/task: CDO08-REL-22
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply-connector
          image: 511825856493.dkr.ecr.us-east-1.amazonaws.com/techx-corp:3cfe2db-kafka-connect@sha256:7defde78e21418b51049a943bf28a6f7aaa1dd4f466b422da9ebb059124736ae
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              for i in $(seq 1 60); do
                if curl -sf http://kafka-connect-orders-archive:8083/connectors >/dev/null; then
                  break
                fi
                sleep 5
              done
              curl -sf -X PUT \
                -H "Content-Type: application/json" \
                --data @/connector/config.json \
                http://kafka-connect-orders-archive:8083/connectors/orders-s3-archive/config
              echo
              curl -sf http://kafka-connect-orders-archive:8083/connectors/orders-s3-archive/status
              echo
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: connector-config
              mountPath: /connector
              readOnly: true
      volumes:
        - name: connector-config
          configMap:
            name: kafka-connect-orders-s3-connector
