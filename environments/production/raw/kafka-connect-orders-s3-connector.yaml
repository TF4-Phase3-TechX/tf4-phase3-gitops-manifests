apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-orders-s3-connector
  namespace: techx-tf4
  labels:
    app.kubernetes.io/name: kafka-connect-orders-s3-connector
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: techx-corp
    cdo08.techx.io/task: CDO08-REL-22
data:
  config.json: |
    {
      "name": "orders-s3-archive",
      "connector.class": "io.confluent.connect.s3.S3SinkConnector",
      "tasks.max": "1",
      "topics": "orders",
      "s3.region": "us-east-1",
      "s3.bucket.name": "tf4-msk-orders-archive-511825856493-us-east-1",
      "topics.dir": "orders",
      "storage.class": "io.confluent.connect.s3.storage.S3Storage",
      "format.class": "io.confluent.connect.s3.format.json.JsonFormat",
      "schema.compatibility": "NONE",
      "key.converter": "org.apache.kafka.connect.storage.StringConverter",
      "value.converter": "org.apache.kafka.connect.json.JsonConverter",
      "value.converter.schemas.enable": "false",
      "partitioner.class": "io.confluent.connect.storage.partitioner.TimeBasedPartitioner",
      "path.format": "'topic'=orders/'year'=YYYY/'month'=MM/'day'=dd/'hour'=HH",
      "partition.duration.ms": "3600000",
      "locale": "en",
      "timezone": "UTC",
      "timestamp.extractor": "Record",
      "rotate.schedule.interval.ms": "600000",
      "flush.size": "100",
      "s3.part.size": "5242880",
      "errors.tolerance": "all",
      "errors.deadletterqueue.topic.name": "orders-archive-dlq",
      "errors.deadletterqueue.topic.replication.factor": "2",
      "errors.deadletterqueue.context.headers.enable": "true",
      "errors.log.enable": "true",
      "errors.log.include.messages": "false",
      "config.action.reload": "none"
    }

---
apiVersion: networking.k8s.io/v1
