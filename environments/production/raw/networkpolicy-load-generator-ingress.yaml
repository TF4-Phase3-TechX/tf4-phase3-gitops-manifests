apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sec21-allow-load-generator-ingress
  namespace: techx-tf4
  labels:
    app.kubernetes.io/part-of: cdo08-sec21
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: load-generator
  policyTypes:
    - Ingress
  # TEMPORARY MANDATE-22 V10 exclusive load-control window. Deny the
  # Cloudflare UI path so no external browser can issue an unrecorded /swarm.
  # Kubernetes NetworkPolicy does not block loopback, so the named operator
  # can still drive Locust through audited `kubectl exec` localhost requests.
  ingress: []
