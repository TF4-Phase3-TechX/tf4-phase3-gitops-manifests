  aiops:
    enabled: true
    # Mandate 22 persists remediation intent before live activation. Recreate
    # avoids a ReadWriteOnce multi-attach race during the single-replica rollout.
    strategy:
      type: Recreate
    persistence:
      enabled: true
      storageClassName: gp3-retain
      size: 1Gi
    podSecurityContext:
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch
    additionalVolumeMounts:
      - name: aiops-saga
        mountPath: /var/lib/aiops/sagas
      - name: aiops-github-demo
        mountPath: /var/run/secrets/github-demo
        readOnly: true
    additionalVolumes:
