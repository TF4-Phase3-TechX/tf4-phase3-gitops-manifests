  # CDO08-REL-17 Blue-Green cutover window is over; useRollout reverted to the
  # chart default (false, plain Deployment/RollingUpdate) — see
  # docs/audit/postmortems/incident-20260723-image-pruning-cve-gate-and-flagd-sync.md.
  # Blue-Green's manual `promote` step was a direct contributor to that
  # incident's recovery time (new pods were healthy but Service traffic stayed
  # pinned to the dead revision until promoted by hand).
  checkout:
