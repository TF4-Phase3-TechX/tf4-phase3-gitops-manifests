  postgresql:
    enabled: false
    command:
      - docker-entrypoint.sh
      - postgres
      - -c
      - wal_level=logical

  kafka:
    enabled: false

  valkey-cart:
    enabled: false

  product-reviews:
    replicas: 2
    strategy:
      type: RollingUpdate
      rollingUpdate:
        # Existing replicas still carry the previous required anti-affinity.
        # Replace one at a time so a node is released before scheduling the
        # new pod; the PDB retains one serving replica throughout the rollout.
        maxUnavailable: 1
        maxSurge: 0
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    schedulingRules:
      nodeSelector:
        kubernetes.io/arch: arm64
        karpenter.sh/capacity-type: spot
        optimization.techx.io/tier: arm64-spot
      affinity:
        podAntiAffinity:
          # The Spot NodePool is capped at two nodes. A required rule deadlocks
          # a maxSurge rollout because the third pod has nowhere to schedule.
          # Prefer host spreading so the steady state remains distributed while
          # allowing one temporary co-location during a zero-unavailable rollout.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: product-reviews
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: optimization.techx.io/tier
          operator: Equal
          value: arm64-spot
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: product-reviews
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: product-reviews
    serviceAccountName: product-reviews-bedrock
    readinessProbe:
      grpc:
        port: 3552
      initialDelaySeconds: 2
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 30
      successThreshold: 1
    envOverrides:
      # Mandate 22 success drill: bounded latency only on review-RPC requests.
      # The fault expires after 15 minutes or 60 eligible requests.
      - name: MANDATE22_REVIEW_DELAY_MS
        value: "2500"
      - name: MANDATE22_REVIEW_DELAY_TTL_SECONDS
        value: "900"
      - name: MANDATE22_REVIEW_DELAY_MAX_REQUESTS
        value: "60"
      - name: AWS_REGION
        value: us-east-1
      - name: BEDROCK_MODEL_ID
        value: us.amazon.nova-2-lite-v1:0
      - name: BEDROCK_GUARDRAIL_ID
        value: e2svpiawj1v5
      - name: BEDROCK_GUARDRAIL_VERSION
        value: "3"
      - name: BEDROCK_OUTPUT_MODE
        value: tool
      - name: BEDROCK_DEADLINE_SECONDS
        # Two production smoke requests completed with safe fallback after
        # about 8 seconds while fault-injection flags were off. Product-QA
        # performs one provider call, so this adds latency headroom without
        # increasing the number of billable Bedrock invocations.
        value: "12"
      - name: BEDROCK_INPUT_USD_PER_MILLION
        value: "0.30"
      - name: BEDROCK_OUTPUT_USD_PER_MILLION
        value: "2.50"
      - name: BEDROCK_SYSTEM_CANARY
        valueFrom:
          secretKeyRef:
