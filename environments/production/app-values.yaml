    serviceAccountName: product-reviews-bedrock
    readinessProbe:
      grpc:
        port: 3552
      initialDelaySeconds: 2
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 30
      successThreshold: 1
    envOverrides:
    - name: MANDATE22_REVIEW_DELAY_MS
      value: '2500'
    - name: MANDATE22_REVIEW_DELAY_TTL_SECONDS
      value: '900'
    - name: MANDATE22_REVIEW_DELAY_MAX_REQUESTS
      value: '240'
    - name: AWS_REGION
      value: us-east-1
    - name: BEDROCK_MODEL_ID
      value: us.amazon.nova-2-lite-v1:0
    - name: BEDROCK_GUARDRAIL_ID
      value: e2svpiawj1v5
    - name: BEDROCK_GUARDRAIL_VERSION
      value: '3'
    - name: BEDROCK_OUTPUT_MODE
      value: tool
    - name: BEDROCK_DEADLINE_SECONDS
      value: '12'
    - name: BEDROCK_INPUT_USD_PER_MILLION
      value: '0.30'
    - name: BEDROCK_OUTPUT_USD_PER_MILLION
      value: '2.50'
    - name: BEDROCK_SYSTEM_CANARY
      valueFrom:
        secretKeyRef:
          name: product-reviews-bedrock-canary
          key: marker
    - name: LLM_OBSERVABILITY_HASH_SALT
      valueFrom:
        secretKeyRef:
          name: product-reviews-llm-observability
          key: hash-salt
    - name: LLM_OBSERVABILITY_ENABLED
      value: 'true'
    - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
      value: 'false'
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10001
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
