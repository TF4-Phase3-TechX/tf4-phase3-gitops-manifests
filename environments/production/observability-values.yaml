# Observability dùng chung: bật 5 subchart, tắt TẤT CẢ app component.
gp3StorageClasses:
  enabled: true

opentelemetry-collector:
  enabled: true
  tolerations:
    - key: optimization.techx.io/tier
      operator: Equal
      value: arm64-canary
      effect: NoSchedule
    - key: optimization.techx.io/tier
      operator: Equal
      value: arm64-spot
      effect: NoSchedule
    - key: optimization.techx.io/tier
      operator: Equal
      value: arm64-protected
      effect: NoSchedule
jaeger: { enabled: true }

prometheus:
  enabled: true
  server:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 1Gi
  alertmanager:
    nodeSelector:
      kubernetes.io/arch: arm64
      karpenter.sh/capacity-type: on-demand
      optimization.techx.io/tier: arm64-protected
    tolerations:
      - key: optimization.techx.io/tier
        operator: Equal
        value: arm64-protected
        effect: NoSchedule

grafana:
  enabled: true
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    optimization.techx.io/tier: arm64-protected
  tolerations:
    - key: optimization.techx.io/tier
      operator: Equal
      value: arm64-protected
      effect: NoSchedule

opensearch:
  enabled: true
  nodeSelector:
    kubernetes.io/arch: arm64
    karpenter.sh/capacity-type: on-demand
    optimization.techx.io/tier: arm64-protected
  tolerations:
    - key: optimization.techx.io/tier
      operator: Equal
      value: arm64-protected
      effect: NoSchedule
  otelLogsLifecycle:
    enabled: true

metrics-server:
  enabled: true
  fullnameOverride: metrics-server
  resources:
    requests: { cpu: 15m, memory: 100Mi }
    limits: { cpu: 100m, memory: 200Mi }

components:
  accounting: { enabled: false }
  ad: { enabled: false }
  cart: { enabled: false }
  checkout: { enabled: false }
  currency: { enabled: false }
  email: { enabled: false }
  fraud-detection: { enabled: false }
  frontend: { enabled: false }
  frontend-proxy: { enabled: false }
  image-provider: { enabled: false }
  load-generator: { enabled: false }
  payment: { enabled: false }
  product-catalog: { enabled: false }
  product-reviews: { enabled: false }
  quote: { enabled: false }
  recommendation: { enabled: false }
  shipping: { enabled: false }
  flagd: { enabled: false }
  kafka: { enabled: false }
  llm: { enabled: false }
  postgresql: { enabled: false }
  valkey-cart: { enabled: false }

bastionPortalAccess:
  enabled: true

cloudflareAccess:
  enabled: true
  namespace: cloudflare-access
  createNamespace: false
  replicas: 2
  tokenSecret:
    name: cloudflare-tunnel-token
    key: token